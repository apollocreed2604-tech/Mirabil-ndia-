<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mansão do Terror - Mirabilândia</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff3333;
            z-index: 10;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 100;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #instructions h1 {
            color: #cc0000;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        #instructions p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            color: #ccc;
        }
        .key {
            background: #222;
            border: 1px solid #555;
            padding: 2px 8px;
            border-radius: 4px;
            color: #ff3333;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Mansão do Terror Mirabilândia</h1>
        <p>Clique aqui para iniciar a exploração.<br>
        Use <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> para mover-se, o <span class="key">Mouse</span> para olhar e <span class="key">F</span> para alternar a lanterna.<br><br>
        <i>"Você não deveria ter entrado aqui..."</i></p>
    </div>

    <div id="ui">
        <h2>Área: Hall Principal</h2>
        <p>Lanterna: <span id="flashlight-status">Ligada [F]</span></p>
    </div>

    <div id="crosshair"></div>

    <!-- Importando Three.js e PointerLockControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let flashlight;
        let flashlightOn = true;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.08);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            // Controles de Teclado
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'KeyF':
                        flashlightOn = !flashlightOn;
                        flashlight.visible = flashlightOn;
                        document.getElementById('flashlight-status').innerText = flashlightOn ? "Ligada [F]" : "Desligada [F]";
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Iluminação Ambiente (Muito escura para clima de terror)
            const ambientLight = new THREE.AmbientLight(0x050508, 1);
            scene.add(ambientLight);

            // Lanterna do Jogador
            flashlight = new THREE.SpotLight(0xffffee, 4, 25, Math.PI / 6, 0.5, 1);
            flashlight.position.set(0, 0, 0);
            flashlight.castShadow = true;
            camera.add(flashlight);
            flashlight.target = camera;
            flashlight.target.position.set(0, 0, -10);
            camera.add(flashlight.target);

            // Construção da Mansão do Terror Mirabilândia
            buildMansion();

            window.addEventListener('resize', onWindowResize);
        }

        function buildMansion() {
            // Materiais Texturizados / Sombrios
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1c130d, roughness: 0.7 });
            const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1.0 });
            const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x2b1810, roughness: 0.8 });

            // Chão Principal
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floor = new THREE.Mesh(floorGeo, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Teto Principal
            const ceiling = new THREE.Mesh(floorGeo, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 5;
            scene.add(ceiling);

            // Paredes Exteriores (A Mansão)
            createWall(-25, 2.5, 0, 50, 5, 1, wallMaterial, 0);
            createWall(25, 2.5, 0, 50, 5, 1, wallMaterial, 0);
            createWall(0, 2.5, -25, 1, 5, 50, wallMaterial, Math.PI / 2);
            createWall(0, 2.5, 25, 1, 5, 50, wallMaterial, Math.PI / 2);

            // Placa da Fachada / Entrada
            const signGroup = new THREE.Group();
            signGroup.position.set(0, 3.5, 24.4);
            
            // Criando letreiro visual rústico
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a0000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#660000';
            ctx.lineWidth = 15;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff2222';
            ctx.font = 'bold 50px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('MANSÃO DO TERROR', canvas.width / 2, 90);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px "Courier New", monospace';
            ctx.fillText('MIRABILÂNDIA', canvas.width / 2, 175);

            const texture = new THREE.CanvasTexture(canvas);
            const signMat = new THREE.MeshBasicMaterial({ map: texture });
            const signGeo = new THREE.PlaneGeometry(6, 1.5);
            const signMesh = new THREE.Mesh(signGeo, signMat);
            scene.add(signMesh);
            signMesh.position.set(0, 3.8, 24.6);

            // Corredores Internos e Paredes Labirínticas
            createWall(-10, 2.5, -5, 20, 5, 1, wallMaterial, 0);
            createWall(10, 2.5, 5, 20, 5, 1, wallMaterial, 0);
            createWall(-5, 2.5, 10, 1, 5, 15, wallMaterial, Math.PI / 2);
            createWall(5, 2.5, -10, 1, 5, 15, wallMaterial, Math.PI / 2);

            // Decoração: Pilares e Atmosfera
            for (let i = -20; i <= 20; i += 10) {
                const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, 5, 8);
                const pillar = new THREE.Mesh(pillarGeo, woodMaterial);
                pillar.position.set(i, 2.5, -15);
                pillar.castShadow = true;
                scene.add(pillar);
            }
        }

        function createWall(x, y, z, width, height, depth, material, rotation) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, y, z);
            wall.rotation.y = rotation;
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Limites simples para não atravessar as paredes externas da mansão
                let pos = camera.position;
                if (pos.x > 24) pos.x = 24;
                if (pos.x < -24) pos.x = -24;
                if (pos.z > 24) pos.z = 24;
                if (pos.z < -24) pos.z = -24;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
